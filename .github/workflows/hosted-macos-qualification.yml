name: Hosted macOS qualification

# Only the coordinator releases a reviewed branch push; preparing this file
# does not launch a run. No pull_request trigger or aggregate suite.
on:
  push:
    branches: [julia/hosted-macos-qualification]

permissions:
  contents: read

concurrency:
  group: hosted-macos-qualification
  cancel-in-progress: false

jobs:
  pr70:
    if: ${{ !cancelled() && github.repository == 'julia-script/foldkit-native' && github.ref == 'refs/heads/julia/hosted-macos-qualification' }}
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed qualification runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: qualification
          persist-credentials: false
      - name: Checkout immutable PR70 target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: e41853d099e96375912d43cb209bad4388ac5654
          path: target
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: Qualify PR70 native scenario
        run: python3 qualification/scripts/qualification/run.py 70 "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/pr70-e41853d099e96375912d43cb209bad4388ac5654"
      - name: Preserve PR70 result and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-pr70-e41853d099e96375912d43cb209bad4388ac5654-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr70-e41853d099e96375912d43cb209bad4388ac5654/
          if-no-files-found: error
          retention-days: 7
  pr71:
