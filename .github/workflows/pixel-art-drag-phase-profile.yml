name: Focused Pixel Art drag phase profile

# Preparation only. First push is a coordinator-released experiment: the
# workflow is not on main and workflow_dispatch cannot enroll it there.
on:
  push:
    branches: [julia/pixel-art-drag-phase-profile]

permissions:
  contents: read

concurrency:
  group: pixel-art-drag-phase-profile
  cancel-in-progress: false

jobs:
  profile:
    if: github.repository == 'julia-script/foldkit-native'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: npm ci
      - name: Run one unchanged original test with aggregate observer
        run: python3 scripts/pixel-art-drag-profile/run.py --out evidence/pixel-drag-profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pixel-drag-profile-${{ github.sha }}
          path: evidence/pixel-drag-profile/
          if-no-files-found: error
