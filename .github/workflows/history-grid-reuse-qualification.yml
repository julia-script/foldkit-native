name: Original native32 history-grid reuse qualification

# Local preparation only; a separately released single push triggers this job.
on:
  push:
    branches: [julia/history-grid-reuse-qualification]

permissions:
  contents: read

concurrency:
  group: history-grid-reuse-qualification
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'julia-script/foldkit-native'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # The reviewed production commit must be published separately before release.
      - name: Obtain immutable baseline, reviewed candidate and production merge objects
        run: git fetch --no-tags origin 56d0f3727e0cb230c98d16977e58e24cc4a215c6 30ef3d00f310634f030d26e49acbe2bfeae7ce5a 7fad8b4fc8059eb12cbf0ec36aa9a60b01d41c77
      - name: Compare two serial fresh original native32 sessions
        run: python3 scripts/history-grid-reuse-qualification/run.py --out evidence/history-grid-reuse-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: history-grid-reuse-qualification-${{ github.sha }}
          path: evidence/history-grid-reuse-qualification/
          if-no-files-found: error
