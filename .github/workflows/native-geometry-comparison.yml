name: Focused native geometry comparison

# Local preparation only; a separately released single push triggers this job.
on:
  push:
    branches: [julia/hosted-geometry-comparison]

permissions:
  contents: read

concurrency:
  group: native-geometry-comparison
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'julia-script/foldkit-native'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: Compare serial fresh original native test sessions
        run: python3 scripts/native-geometry-comparison/run.py --out evidence/native-geometry-comparison
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-geometry-comparison-${{ github.sha }}
          path: evidence/native-geometry-comparison/
          if-no-files-found: error
