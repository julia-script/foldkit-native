name: Focused original scroll repair qualification

# Local preparation only; a separately released single push triggers this job.
on:
  push:
    branches: [julia/hosted-scroll-repair-qualification]

permissions:
  contents: read

concurrency:
  group: scroll-repair-qualification
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'julia-script/foldkit-native'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # The reviewed production commit must be published separately before release.
      - name: Obtain the immutable reviewed candidate object
        run: git fetch --no-tags origin 2c8347cb327a11d4f6bee4aaeb48a82f4774f764
      - name: Compare four serial fresh original native test sessions
        run: python3 scripts/scroll-repair-qualification/run.py --out evidence/scroll-repair-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scroll-repair-qualification-${{ github.sha }}
          path: evidence/scroll-repair-qualification/
          if-no-files-found: error
